name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --stacktrace assembleDebug

      - name: Prepare complete project ZIP
        run: |
          rm -rf /tmp/AgendaComercial-export
          mkdir -p /tmp/AgendaComercial-export/AgendaComercial-Android
          git archive --format=tar HEAD | tar -x -C /tmp/AgendaComercial-export/AgendaComercial-Android
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/AgendaComercial-export/AgendaComercial-Android/AgendaComercial-v1.0.0.apk
          cd /tmp/AgendaComercial-export
          zip -r "$GITHUB_WORKSPACE/AgendaComercial-recursos-completos-v1.0.0.zip" AgendaComercial-Android

      - uses: actions/upload-artifact@v4
        with:
          name: AgendaComercial-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: AgendaComercial-source-complete
          path: AgendaComercial-recursos-completos-v1.0.0.zip
          if-no-files-found: error
